<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#7258a5"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Family Hub"/>
  <meta name="description" content="Family calendar, dinner plans, shopping, chores, and photos on one shared screen."/>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="assets/apple-icon.png"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="v2.css"/>
  <link rel="stylesheet" href="v3.css"/>
  <title>Family Hub 3.0</title>
</head>
<body>
  <div id="app"><div class="loading-screen"><div class="loading-mark">⌂</div><strong>Family Hub</strong><span>Getting the family organized…</span></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script>
    // Load the database library only when shared mode is configured.
    // Demo mode works even if external CDNs are unreachable.
    (function(){
      function app(){var s=document.createElement('script');s.src='app.js';document.body.appendChild(s)}
      var c=window.FAMILY_CONFIG||{};
      if(c.supabaseUrl && c.supabasePublishableKey){
        var s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
        s.onload=app;s.onerror=app;document.body.appendChild(s);
      } else app();
    })();
  </script>
</body>
</html>
